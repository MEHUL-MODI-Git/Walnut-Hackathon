[project]
name = "walnut"
version = "0.1.0"
description = "The company brain that refuses — cited evidence across five apps, governed action."
requires-python = ">=3.11"
dependencies = [
    "semantica>=0.6.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0"]
obs = ["uselemma-tracing"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
